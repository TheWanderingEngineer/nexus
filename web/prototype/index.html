<title>Nexus Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">

<style>
:root{
  --void:#CFC9DE; --panel:#E4E0EE; --panel-hi:#F2EFF8; --sunk:#C4BDD6;
  --bevel-lt:#FFFFFF; --bevel-dk:#8B82A6; --rule:#B3A9C9;
  --text:#1C1528; --text-2:#4A4063; --text-3:#7A6F96;
  --accent:#0F6E85; --accent-2:#7B3FB8; --on-accent:#FFFFFF;
  --ok:#1F7A45; --warn:#9A6200; --crit:#B32334;
  --scan:rgba(28,21,40,.05);
  --u:4px;
  --pixel:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --screen:"Silkscreen","Courier New",monospace;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --void:#14101F; --panel:#221B33; --panel-hi:#2E2545; --sunk:#191327;
  --bevel-lt:#4A3D6B; --bevel-dk:#0D0916; --rule:#3A2F55;
  --text:#E8E2F5; --text-2:#A99CC4; --text-3:#6E6291;
  --accent:#4EE1E8; --accent-2:#C77DFF; --on-accent:#14101F;
  --ok:#5CE68A; --warn:#FFC145; --crit:#FF4D5E;
  --scan:rgba(0,0,0,.22);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --void:#14101F; --panel:#221B33; --panel-hi:#2E2545; --sunk:#191327;
  --bevel-lt:#4A3D6B; --bevel-dk:#0D0916; --rule:#3A2F55;
  --text:#E8E2F5; --text-2:#A99CC4; --text-3:#6E6291;
  --accent:#4EE1E8; --accent-2:#C77DFF; --on-accent:#14101F;
  --ok:#5CE68A; --warn:#FFC145; --crit:#FF4D5E;
  --scan:rgba(0,0,0,.22);
  color-scheme:dark;
}

*{box-sizing:border-box}
img{image-rendering:pixelated;display:block}
html,body{height:100%}
body{
  background:var(--void); color:var(--text);
  font-family:var(--pixel); font-size:15px; line-height:1.5;
  margin:0; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}

/* scanline veil over everything */
#scan{
  position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(var(--scan) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
:root:not([data-theme="light"]) #scan{mix-blend-mode:normal}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #scan{mix-blend-mode:multiply}}
:root[data-theme="light"] #scan{mix-blend-mode:multiply}

.raised{border-top:var(--u) solid var(--bevel-lt);border-left:var(--u) solid var(--bevel-lt);
        border-right:var(--u) solid var(--bevel-dk);border-bottom:var(--u) solid var(--bevel-dk)}
.inset{border-top:var(--u) solid var(--bevel-dk);border-left:var(--u) solid var(--bevel-dk);
       border-right:var(--u) solid var(--bevel-lt);border-bottom:var(--u) solid var(--bevel-lt)}

/* ================= SHELL ================= */
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}

#topbar{
  display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:calc(var(--u)*2) calc(var(--u)*3);
  background:var(--panel);
  border-bottom:var(--u) solid var(--bevel-dk);
}
#logo{width:32px;height:32px;flex:none}
.brand{font-family:var(--screen);font-size:15px;letter-spacing:.1em;color:var(--text)}
.brand .v{color:var(--text-3);font-size:10px;margin-left:6px}
.spacer{flex:1}
.stat{
  display:flex;align-items:center;gap:calc(var(--u)*1.5);
  font-family:var(--screen);font-size:10px;letter-spacing:.06em;
  padding:calc(var(--u)) calc(var(--u)*2);
  background:var(--sunk);
  border-top:2px solid var(--bevel-dk);border-left:2px solid var(--bevel-dk);
  border-right:2px solid var(--bevel-lt);border-bottom:2px solid var(--bevel-lt);
  color:var(--text-2);white-space:nowrap;
}
.stat b{color:var(--text);font-weight:400;font-variant-numeric:tabular-nums}
.dot{width:var(--u);height:var(--u);background:currentColor;flex:none}
.dot.live{animation:blip 1.6s steps(2,end) infinite}
@keyframes blip{0%,60%{opacity:1}61%,100%{opacity:.25}}
#clock{font-family:var(--screen);font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.04em}

.tbtn{
  font-family:var(--screen);font-size:10px;letter-spacing:.07em;
  padding:calc(var(--u)*1.5) calc(var(--u)*2.5);background:var(--panel);
  border-top:2px solid var(--bevel-lt);border-left:2px solid var(--bevel-lt);
  border-right:2px solid var(--bevel-dk);border-bottom:2px solid var(--bevel-dk);
}
.tbtn:active{border-top-color:var(--bevel-dk);border-left-color:var(--bevel-dk);
             border-right-color:var(--bevel-lt);border-bottom-color:var(--bevel-lt)}

#body{display:grid;grid-template-columns:auto minmax(0,1fr);min-height:0}

/* ---- left rail ---- */
#rail{
  display:flex;flex-direction:column;gap:calc(var(--u)*2);
  padding:calc(var(--u)*3) calc(var(--u)*2);
  background:var(--panel);
  border-right:var(--u) solid var(--bevel-dk);
}
.nav{
  width:calc(var(--u)*12);height:calc(var(--u)*12);
  display:grid;place-items:center;position:relative;
  background:var(--panel);
  border-top:2px solid var(--bevel-lt);border-left:2px solid var(--bevel-lt);
  border-right:2px solid var(--bevel-dk);border-bottom:2px solid var(--bevel-dk);
}
.nav img{width:24px;height:24px}
.nav.on{background:var(--accent-2)}
.nav.on::after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:var(--u);height:calc(var(--u)*4);background:var(--accent)}
.nav:hover{background:var(--panel-hi)}
.nav.on:hover{background:var(--accent-2)}
.nav .tip{
  position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  font-family:var(--screen);font-size:9px;letter-spacing:.08em;white-space:nowrap;
  background:var(--sunk);color:var(--text);padding:3px 6px;border:2px solid var(--bevel-dk);
  opacity:0;pointer-events:none;transition:opacity .1s;z-index:50;
}
.nav:hover .tip{opacity:1}

/* ---- canvas ---- */
#main{overflow:auto;padding:calc(var(--u)*4);min-width:0}
#toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:calc(var(--u)*2);margin-bottom:calc(var(--u)*4)}
#toolbar h1{font-family:var(--screen);font-size:16px;letter-spacing:.08em;margin:0;color:var(--text)}
#toolbar .hint{font-size:13px;color:var(--text-3);margin-left:calc(var(--u)*2)}

#grid{position:relative;min-height:200px}

.w{
  position:absolute;background:var(--panel);overflow:hidden;
  border-top:var(--u) solid var(--bevel-lt);border-left:var(--u) solid var(--bevel-lt);
  border-right:var(--u) solid var(--bevel-dk);border-bottom:var(--u) solid var(--bevel-dk);
  display:flex;flex-direction:column;
  transition:left .12s steps(3,end),top .12s steps(3,end),width .12s steps(3,end),height .12s steps(3,end);
}
.w.dragging{transition:none;z-index:100;filter:brightness(1.08)}
.w.resizing{transition:none;z-index:100}
.w.spawn{animation:spawn .18s steps(3,end)}
@keyframes spawn{from{transform:scale(.82)}to{transform:scale(1)}}
.w-head{
  display:flex;align-items:center;gap:calc(var(--u)*2);
  padding:calc(var(--u)*1.5) calc(var(--u)*2);
  background:var(--sunk);cursor:grab;flex:none;
  border-bottom:2px solid var(--bevel-dk);
}
.w.dragging .w-head{cursor:grabbing}
.w-head img{width:16px;height:16px;flex:none}
.w-head .t{
  font-family:var(--screen);font-size:9px;letter-spacing:.1em;color:var(--text-2);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.w-x{
  font-family:var(--screen);font-size:10px;color:var(--text-3);
  width:16px;height:16px;display:grid;place-items:center;flex:none;
}
.w-x:hover{color:var(--crit);background:var(--panel)}
.w-body{padding:calc(var(--u)*3);flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*2);overflow:hidden}
.w-rs{
  position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
  background:repeating-linear-gradient(135deg,transparent 0 2px,var(--bevel-dk) 2px 4px);
}

/* widget internals */
.big{font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.big .u{font-size:13px;color:var(--text-3);font-weight:400}
.sub{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.chart{width:100%;flex:1;min-height:0;display:block}
.meter{display:flex;gap:2px;height:calc(var(--u)*4);padding:2px;flex:none}
.meter i{flex:1;background:var(--rule)}
.meter i.on{background:var(--accent)}
.meter i.warn{background:var(--warn)}
.meter i.crit{background:var(--crit)}
.klist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.5);overflow:auto;min-height:0}
.klist li{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);font-size:13px}
.klist .k{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.klist .v{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--screen);font-size:9px;
      letter-spacing:.08em;padding:2px 5px;border:2px solid currentColor;flex:none}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.crit{color:var(--crit)} .pill.idle{color:var(--text-3)}

.term{background:#0D0916;padding:calc(var(--u)*2);flex:1;min-height:0;overflow:hidden}
.term pre{margin:0;font-family:var(--mono);font-size:11px;line-height:1.6;color:#C9C2DE;white-space:pre-wrap;word-break:break-all}
.term .p{color:#5CE68A} .term .a{color:#4EE1E8}
.cur{display:inline-block;width:6px;height:12px;background:#5CE68A;vertical-align:-2px;animation:cb 1s steps(2,end) infinite}
@keyframes cb{0%,50%{opacity:1}51%,100%{opacity:0}}

.clockbig{font-family:var(--screen);font-size:clamp(22px,7cqw,40px);letter-spacing:.04em;
          font-variant-numeric:tabular-nums;text-align:center;color:var(--text)}
.catwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);min-height:0}
#catimg,.catimg{width:64px;height:64px;animation:breathe 3.2s steps(2,end) infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.catmsg{font-family:var(--screen);font-size:9px;letter-spacing:.08em;color:var(--text-3);text-align:center}

.links{display:flex;flex-direction:column;gap:calc(var(--u)*1.5);overflow:auto;min-height:0}
.link{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.5) calc(var(--u)*2);
      background:var(--sunk);font-size:13px;color:var(--text-2)}
.link:hover{background:var(--panel-hi);color:var(--text)}
.link .sq{width:8px;height:8px;background:var(--accent);flex:none}

/* ---- add-widget drawer ---- */
#drawer{
  position:fixed;inset:0;z-index:500;display:none;
  background:rgba(13,9,22,.6);
  padding:calc(var(--u)*6);overflow:auto;
}
#drawer.open{display:block}
.dw{max-width:760px;margin:0 auto;background:var(--panel)}
.dw-head{display:flex;align-items:center;gap:calc(var(--u)*2);background:var(--accent-2);
         padding:calc(var(--u)*2) calc(var(--u)*3);font-family:var(--screen);font-size:12px;
         letter-spacing:.08em;color:#fff}
:root:not([data-theme="light"]) .dw-head{color:#14101F}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .dw-head{color:#fff}}
:root[data-theme="light"] .dw-head{color:#fff}
.dw-body{padding:calc(var(--u)*4);display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:calc(var(--u)*3)}
.card{display:flex;gap:calc(var(--u)*2);align-items:flex-start;padding:calc(var(--u)*3);
      background:var(--panel);text-align:left;
      border-top:2px solid var(--bevel-lt);border-left:2px solid var(--bevel-lt);
      border-right:2px solid var(--bevel-dk);border-bottom:2px solid var(--bevel-dk)}
.card:hover{background:var(--panel-hi)}
.card:active{border-top-color:var(--bevel-dk);border-left-color:var(--bevel-dk);
             border-right-color:var(--bevel-lt);border-bottom-color:var(--bevel-lt)}
.card img{width:20px;height:20px;flex:none}
.card .cn{font-family:var(--screen);font-size:10px;letter-spacing:.06em;display:block;margin-bottom:3px}
.card .cd{font-size:12px;color:var(--text-3);line-height:1.35}

#empty{padding:calc(var(--u)*10);text-align:center;color:var(--text-3);font-family:var(--screen);
       font-size:11px;letter-spacing:.08em;background:var(--sunk)}

:focus-visible{outline:var(--u) solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  #rail{flex-direction:row;overflow-x:auto}
  #body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
}
</style>

/* ============ FAKE TELEMETRY ============ */
const N = 44;
const ring = k => ({ k, d:new Array(N).fill(0) });
const S = {
  cpu:ring("cpu"), mem:ring("mem"), net_rx:ring("rx"), net_tx:ring("tx"),
  cpuV:34, memV:58, rxV:12, txV:4,
  temps:[{n:"CPU Package",v:52,max:85},{n:"NVMe 0",v:41,max:70},
         {n:"WD Red 8TB",v:36,max:55},{n:"Chassis fan",v:1180,max:2400,unit:"rpm"}],
  disks:[{n:"/DATA",used:7.62,total:9.06},{n:"/",used:41.2,total:118}],
  containers:[
    {n:"jellyfin",s:"up",c:2.1},{n:"immich-server",s:"up",c:8.4},
    {n:"postgres",s:"up",c:0.9},{n:"sonarr",s:"down",c:0},
    {n:"radarr",s:"up",c:1.3},{n:"traefik",s:"up",c:0.4}
  ],
  boot: Date.now() - 1000*60*60*24*9 - 1000*60*47
};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const walk=(v,amt,a,b)=>clamp(v+(Math.random()-.5)*amt,a,b);
function push(r,v){ r.d.push(v); if(r.d.length>N) r.d.shift(); }

function tick(){
  S.cpuV = walk(S.cpuV, 16, 6, 96);
  S.memV = walk(S.memV, 3, 30, 88);
  S.rxV  = Math.abs(walk(S.rxV, 22, 0, 140));
  S.txV  = Math.abs(walk(S.txV, 8, 0, 45));
  push(S.cpu,S.cpuV); push(S.mem,S.memV); push(S.net_rx,S.rxV); push(S.net_tx,S.txV);
  S.temps[0].v = clamp(38 + S.cpuV*0.34, 38, 92);
  S.temps[1].v = walk(S.temps[1].v,.6,36,58);
  S.temps[2].v = walk(S.temps[2].v,.4,33,44);
  S.temps[3].v = clamp(900 + S.cpuV*9, 700, 2400);
  S.containers.forEach(c=>{ if(c.s==="up") c.c = Math.max(0, walk(c.c,1.4,0,26)); });
}
for(let i=0;i<N;i++) tick();

/* ============ SVG STEP CHART ============ */
function stepPath(vals,w,h,maxV){
  const n=vals.length, sw=w/(n-1); let d="";
  for(let i=0;i<n;i++){
    const y=Math.round(h - (vals[i]/maxV)*(h-2)) - 1;
    const x=Math.round(i*sw);
    d += (i===0? "M"+x+","+y : "H"+x+"V"+y);
  }
  return d;
}
function drawChart(svg,vals,maxV,color){
  const w=120,h=40;
  svg.setAttribute("viewBox","0 0 "+w+" "+h);
  svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("shape-rendering","crispEdges");
  const line=stepPath(vals,w,h,maxV);
  svg.innerHTML =
    '<path d="'+line+' V'+h+' H0 Z" fill="'+color+'" fill-opacity="0.16"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function meterHTML(pct,warnAt,critAt,segs){
  segs=segs||14; let h="";
  const on=Math.round((pct/100)*segs);
  for(let i=0;i<segs;i++){
    const p=((i+1)/segs)*100;
    let cls = i<on ? (p>=critAt?"crit":p>=warnAt?"warn":"on") : "";
    h += '<i class="'+cls+'"></i>';
  }
  return h;
}
function fmtUp(ms){
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), hh=Math.floor(s%86400/3600), mm=Math.floor(s%3600/60);
  return d+"d "+hh+"h "+mm+"m";
}

    update(r){ r.n.textContent=fmtUp(Date.now()-S.boot); } },

  cat:{ name:"Server Cat", icon:ICO.cat, desc:"Sleeps when idle, wakes when the box is busy", w:3,h:4,
    mount(b){ b.innerHTML='<div class="catwrap"><img class="catimg" src="'+ICO.cat+'" alt="cat">'+
      '<span class="catmsg"></span></div>';
      return {i:b.querySelector("img"),m:b.querySelector(".catmsg")}; },
    update(r){
      const hot=S.cpuV>72, busy=S.cpuV>45;
      r.m.textContent = hot ? "!! TOO WARM TO NAP" : busy ? "ONE EYE OPEN" : "ZZZ... ALL QUIET";
      r.i.style.filter = hot ? "hue-rotate(-25deg) saturate(1.4)" : "none";
      r.i.style.animationDuration = hot ? "0.9s" : busy ? "2s" : "3.2s";
    } },

  terminal:{ name:"Terminal", icon:ICO.terminal, desc:"Live tail of recent shell activity", w:5,h:4,
    mount(b){ b.innerHTML='<div class="term inset"><pre></pre></div>';
      return {p:b.querySelector("pre"),i:0,buf:[],t:0}; },
    update(r){
      const lines=[
        '<span class="p">root@nexus</span>:<span class="a">/DATA</span># docker ps --format "{{.Names}}"',
        'jellyfin','immich-server','postgres','traefik',
        '<span class="p">root@nexus</span>:<span class="a">/DATA</span># smartctl -A /dev/sda | grep Temp',
        '194 Temperature_Celsius     0x0022   038',
        '<span class="p">root@nexus</span>:<span class="a">/DATA</span># uptime',
        ' 21:42:09 up 9 days,  0:47,  1 user'
      ];
      r.t++; if(r.t%3) return;
      r.buf.push(lines[r.i % lines.length]); r.i++;
      if(r.buf.length>9) r.buf.shift();
      r.p.innerHTML=r.buf.join("\n")+'<span class="cur"></span>';
    } },

  links:{ name:"Quick Links", icon:ICO.apps, desc:"Shortcuts to your services", w:3,h:4,
    mount(b){ b.innerHTML='<div class="links">'+
      ["Jellyfin","Immich","Sonarr","Traefik","Portainer"].map(function(n){
        return '<a class="link" href="#" onclick="return false"><i class="sq"></i>'+n+'</a>';}).join("")+
      '</div>'; return {}; },
    update(){} }
};

/* ============ GRID ENGINE ============ */
const COLS=12, ROW=44, GAP=8;
const gridEl=document.getElementById("grid");
const emptyEl=document.getElementById("empty");
let items=[], mounted={}, uid=1;

const DEFAULT=[
  {t:"cpu",x:0,y:0,w:4,h:4},   {t:"memory",x:4,y:0,w:4,h:3},
  {t:"cat",x:8,y:0,w:4,h:4},   {t:"network",x:4,y:3,w:4,h:4},
  {t:"temps",x:0,y:4,w:4,h:4}, {t:"containers",x:8,y:4,w:4,h:4},
  {t:"storage",x:0,y:8,w:4,h:4},{t:"terminal",x:4,y:7,w:5,h:4},
  {t:"clock",x:9,y:8,w:3,h:3}
];

function cellW(){ return (gridEl.clientWidth - (COLS-1)*GAP) / COLS; }
const overlap=(a,b)=> a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

function resolve(movedId){
  let guard=0, moved=true;
  while(moved && guard++<300){
    moved=false;
    for(const a of items) for(const b of items){
      if(a===b || b.id===movedId) continue;
      if(overlap(a,b) && (a.id===movedId || a.y<b.y || (a.y===b.y && a.x<b.x))){
        b.y = a.y + a.h; moved=true;
      }
    }
  }
}
function compact(){
  items.slice().sort((p,q)=>p.y-q.y||p.x-q.x).forEach(function(it){
    while(it.y>0){
      it.y--;
      if(items.some(o=>o!==it && overlap(it,o))){ it.y++; break; }
    }
  });
}
function place(el,it){
  const cw=cellW();
  el.style.left  = Math.round(it.x*(cw+GAP))+"px";
  el.style.top   = Math.round(it.y*(ROW+GAP))+"px";
  el.style.width = Math.round(it.w*cw+(it.w-1)*GAP)+"px";
  el.style.height= Math.round(it.h*ROW+(it.h-1)*GAP)+"px";
}
function layout(){
  items.forEach(it=>place(document.getElementById("w"+it.id),it));
  const maxY=items.reduce((m,i)=>Math.max(m,i.y+i.h),0);
  gridEl.style.height=(maxY*(ROW+GAP))+"px";
  emptyEl.hidden = items.length>0;
  save();
}

function build(it,animate){
  const def=REG[it.t]; if(!def) return;
  const el=document.createElement("div");
  el.className="w raised"+(animate?" spawn":""); el.id="w"+it.id;
  el.innerHTML='<div class="w-head"><img src="'+def.icon+'" alt=""><span class="t">'+
    def.name.toUpperCase()+'</span><button class="w-x" title="Remove">X</button></div>'+
    '<div class="w-body"></div><div class="w-rs"></div>';
  gridEl.appendChild(el);
  const body=el.querySelector(".w-body");
  mounted[it.id]={def, ref:def.mount(body)};
  el.querySelector(".w-x").addEventListener("click",e=>{e.stopPropagation();remove(it.id);});
  dragify(el,it); resizify(el,it);
  place(el,it);
  try{ mounted[it.id].def.update(mounted[it.id].ref); }catch(e){}
}
function remove(id){
  const el=document.getElementById("w"+id); if(el) el.remove();
  items=items.filter(i=>i.id!==id); delete mounted[id];
  compact(); layout();
}
function add(type){
  const maxY=items.reduce((m,i)=>Math.max(m,i.y+i.h),0);
  const d=REG[type];
  const it={id:uid++,t:type,x:0,y:maxY,w:d.w,h:d.h};
  items.push(it); build(it,true); compact(); layout();
  document.getElementById("main").scrollTo({top:1e6,behavior:"smooth"});
}

/* ---- drag ---- */
function dragify(el,it){
  const head=el.querySelector(".w-head");
  head.addEventListener("pointerdown",function(e){
    if(e.target.closest(".w-x")) return;
    e.preventDefault(); head.setPointerCapture(e.pointerId);
    const cw=cellW(), sx=e.clientX, sy=e.clientY, ox=it.x, oy=it.y;
    el.classList.add("dragging");
    function mv(ev){
      const dx=Math.round((ev.clientX-sx)/(cw+GAP)), dy=Math.round((ev.clientY-sy)/(ROW+GAP));
      const nx=clamp(ox+dx,0,COLS-it.w), ny=Math.max(0,oy+dy);
      if(nx!==it.x||ny!==it.y){ it.x=nx; it.y=ny; resolve(it.id); layout(); }
      place(el,it);
    }
    function up(ev){
      head.releasePointerCapture(e.pointerId);
      head.removeEventListener("pointermove",mv); head.removeEventListener("pointerup",up);
      el.classList.remove("dragging"); compact(); layout();
    }
    head.addEventListener("pointermove",mv); head.addEventListener("pointerup",up);
  });
}
/* ---- resize ---- */
function resizify(el,it){
  const h=el.querySelector(".w-rs");
  h.addEventListener("pointerdown",function(e){
    e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
    const cw=cellW(), sx=e.clientX, sy=e.clientY, ow=it.w, oh=it.h;
    el.classList.add("resizing");
    function mv(ev){
      const dw=Math.round((ev.clientX-sx)/(cw+GAP)), dh=Math.round((ev.clientY-sy)/(ROW+GAP));
      const nw=clamp(ow+dw,2,COLS-it.x), nh=Math.max(2,oh+dh);
      if(nw!==it.w||nh!==it.h){ it.w=nw; it.h=nh; resolve(it.id); layout(); }
      place(el,it);
    }
    function up(){
      h.releasePointerCapture(e.pointerId);
      h.removeEventListener("pointermove",mv); h.removeEventListener("pointerup",up);
      el.classList.remove("resizing"); compact(); layout();
    }
    h.addEventListener("pointermove",mv); h.addEventListener("pointerup",up);
  });
}

/* ---- persistence ---- */
const KEY="nexus.layout.v1";
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const p=JSON.parse(raw);
      if(Array.isArray(p)&&p.length){ items=p.filter(i=>REG[i.t]); uid=Math.max.apply(null,items.map(i=>i.id))+1; return; } }
  }catch(e){}
  items=DEFAULT.map((d,i)=>({id:i+1,t:d.t,x:d.x,y:d.y,w:d.w,h:d.h})); uid=items.length+1;
}

/* ============ BOOT ============ */
load();
items.forEach(it=>build(it,false));
compact(); layout();

// widget library
const dbody=document.getElementById("dbody");
Object.keys(REG).forEach(function(k){
  const d=REG[k];
  const b=document.createElement("button");
  b.className="card";
  b.innerHTML='<img src="'+d.icon+'" alt=""><span><span class="cn">'+d.name.toUpperCase()+
              '</span><span class="cd">'+d.desc+'</span></span>';
  b.addEventListener("click",function(){ add(k); document.getElementById("drawer").classList.remove("open"); });
  dbody.appendChild(b);
});
document.getElementById("add").addEventListener("click",()=>document.getElementById("drawer").classList.add("open"));
document.getElementById("dclose").addEventListener("click",()=>document.getElementById("drawer").classList.remove("open"));
document.getElementById("drawer").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });
document.getElementById("reset").addEventListener("click",function(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  gridEl.innerHTML=""; mounted={}; load(); items.forEach(it=>build(it,true)); compact(); layout();
});

// nav
document.querySelectorAll(".nav").forEach(function(n){
  n.addEventListener("click",function(){
    document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));
    n.classList.add("on");
    document.querySelector("#toolbar h1").textContent =
      ({dash:"DASHBOARD",apps:"APP STORE",files:"FILES",term:"TERMINAL",settings:"SETTINGS"})[n.dataset.page];
  });
});

// theme toggle
document.getElementById("theme").addEventListener("click",function(){
  const r=document.documentElement;
  const dark = r.getAttribute("data-theme")==="dark" ||
    (!r.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  r.setAttribute("data-theme", dark?"light":"dark");
});

// animated CRT logo in the topbar
if(CRT.length>1){
  let f=0; const lg=document.getElementById("logo");
  setInterval(function(){ f=(f+1)%CRT.length; lg.src=CRT[f]; }, 130);
}

// clock + telemetry loop
function frame(){
  const n=new Date();
  document.getElementById("clock").textContent =
    [n.getHours(),n.getMinutes(),n.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
  tick();
  document.getElementById("tb-cpu").textContent=S.cpuV.toFixed(0)+"%";
  document.getElementById("tb-mem").textContent=S.memV.toFixed(0)+"%";
  document.getElementById("tb-temp").textContent=S.temps[0].v.toFixed(0)+"°C";
  for(const id in mounted){ try{ mounted[id].def.update(mounted[id].ref); }catch(e){} }
}
frame(); setInterval(frame,1000);
addEventListener("resize",layout);
})();
</script>
